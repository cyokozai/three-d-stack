---
# setup-node.yml — Bootstrap a VM for Three-D Stack
#
# Usage:
#   # Local (OrbStack)
#   ansible-playbook -i inventories/local playbooks/setup-node.yml
#
#   # Proxmox VE
#   ansible-playbook -i inventories/proxmox playbooks/setup-node.yml
#
#   # Single host override
#   ansible-playbook -i inventories/local playbooks/setup-node.yml -l three-ds

- name: Bootstrap 3DS node
  hosts: three_ds_nodes
  become: true

  roles:
    - role: 3ds_base
