---
# dewy_setup — Install Dewy binary and create systemd services per app

# ---- Normalize input ----
# Extra vars (-e) have highest precedence; set_fact cannot override them.
# Use a private fact _dewy_apps so loop tasks always receive a proper list.

- name: Normalize dewy_apps to list
  ansible.builtin.set_fact:
    _dewy_apps: "{{ dewy_apps | from_yaml if dewy_apps is string else dewy_apps }}"

- name: Verify dewy_apps resolved to a list
  ansible.builtin.assert:
    that:
      - _dewy_apps is iterable
      - _dewy_apps is not string
    fail_msg: >-
      dewy_apps must be a list (got {{ _dewy_apps | type_debug }}).
      Use -e "dewy_apps=['your-app']" — not -e "dewy_apps=your-app".

# ---- Binary installation ----

- name: Auto-detect Dewy architecture (skipped when dewy_arch is already set)
  ansible.builtin.set_fact:
    dewy_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"
  when: not dewy_arch

- name: Download Dewy binary archive
  ansible.builtin.get_url:
    url: "https://github.com/linyows/dewy/releases/download/v{{ dewy_version }}/dewy_linux_{{ dewy_arch }}.tar.gz"
    dest: "/tmp/dewy_{{ dewy_version }}_linux_{{ dewy_arch }}.tar.gz"
    mode: "0644"

- name: Extract Dewy binary directly to install dir
  ansible.builtin.command:
    cmd: "tar xzf /tmp/dewy_{{ dewy_version }}_linux_{{ dewy_arch }}.tar.gz -C {{ dewy_install_dir }} dewy"
  changed_when: true

- name: Set Dewy binary permissions
  ansible.builtin.file:
    path: "{{ dewy_install_dir }}/dewy"
    mode: "0755"

- name: Remove downloaded archive
  ansible.builtin.file:
    path: "/tmp/dewy_{{ dewy_version }}_linux_{{ dewy_arch }}.tar.gz"
    state: absent

# ---- Per-app deployment ----

- name: Create app directories on VM
  ansible.builtin.file:
    path: "{{ three_ds_apps_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ _dewy_apps }}"

- name: Check if backup/ directory exists on control node (per app)
  ansible.builtin.stat:
    path: "{{ apps_dir }}/{{ item }}/backup"
  delegate_to: localhost
  become: false
  register: backup_stat
  loop: "{{ _dewy_apps }}"

- name: Create backups directory on VM (only for apps with backup/)
  ansible.builtin.file:
    path: "{{ three_ds_apps_dir }}/{{ item.item }}/backup/backups"
    state: directory
    mode: "0755"
  loop: "{{ backup_stat.results }}"
  when: item.stat.exists and item.stat.isdir
  loop_control:
    label: "{{ item.item }}"

- name: Copy backup/hooks to VM (only for apps with backup/)
  ansible.builtin.copy:
    src: "{{ apps_dir }}/{{ item.item }}/backup/hooks/"
    dest: "{{ three_ds_apps_dir }}/{{ item.item }}/backup/hooks/"
    mode: "0755"
  loop: "{{ backup_stat.results }}"
  when: item.stat.exists and item.stat.isdir
  loop_control:
    label: "{{ item.item }}"

- name: Copy backup/compose.yaml to VM (only for apps with backup/)
  ansible.builtin.copy:
    src: "{{ apps_dir }}/{{ item.item }}/backup/compose.yaml"
    dest: "{{ three_ds_apps_dir }}/{{ item.item }}/backup/compose.yaml"
    mode: "0644"
  loop: "{{ backup_stat.results }}"
  when: item.stat.exists and item.stat.isdir
  loop_control:
    label: "{{ item.item }}"

- name: Check if dewy.env.example exists on control node
  ansible.builtin.stat:
    path: "{{ apps_dir }}/{{ item }}/dewy.env.example"
  delegate_to: localhost
  become: false
  register: dewy_env_example_stat
  loop: "{{ _dewy_apps }}"

- name: Copy dewy.env.example to VM (if present on control node)
  ansible.builtin.copy:
    src: "{{ apps_dir }}/{{ item.item }}/dewy.env.example"
    dest: "{{ three_ds_apps_dir }}/{{ item.item }}/dewy.env.example"
    mode: "0644"
  loop: "{{ dewy_env_example_stat.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: Check if dewy.env exists on control node
  ansible.builtin.stat:
    path: "{{ apps_dir }}/{{ item }}/dewy.env"
  delegate_to: localhost
  become: false
  register: dewy_env_stat
  loop: "{{ _dewy_apps }}"

- name: Copy dewy.env to VM (if present on control node)
  ansible.builtin.copy:
    src: "{{ apps_dir }}/{{ item.item }}/dewy.env"
    dest: "{{ three_ds_apps_dir }}/{{ item.item }}/dewy.env"
    mode: "0600"
  loop: "{{ dewy_env_stat.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: Warn if dewy.env is missing on control node
  ansible.builtin.debug:
    msg: >-
      [WARN] {{ apps_dir }}/{{ item.item }}/dewy.env not found on control node.
      Copy dewy.env.example to dewy.env, fill in your values,
      then re-run this playbook to start the service.
  loop: "{{ dewy_env_stat.results }}"
  when: not item.stat.exists
  loop_control:
    label: "{{ item.item }}"

- name: Check if app.env exists on control node
  ansible.builtin.stat:
    path: "{{ apps_dir }}/{{ item }}/app.env"
  delegate_to: localhost
  become: false
  register: app_env_stat
  loop: "{{ _dewy_apps }}"

- name: Copy app.env to VM (if present on control node)
  ansible.builtin.copy:
    src: "{{ apps_dir }}/{{ item.item }}/app.env"
    dest: "{{ three_ds_apps_dir }}/{{ item.item }}/app.env"
    mode: "0600"
  loop: "{{ app_env_stat.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item }}"

# ---- start script + systemd unit ----

- name: Deploy start wrapper script for each app
  ansible.builtin.template:
    src: dewy-start.sh.j2
    dest: "{{ three_ds_apps_dir }}/{{ item }}/dewy-start.sh"
    mode: "0755"
  vars:
    app_name: "{{ item }}"
  loop: "{{ _dewy_apps }}"

- name: Install systemd unit for each app
  ansible.builtin.template:
    src: dewy.service.j2
    dest: "/etc/systemd/system/dewy-{{ item }}.service"
    mode: "0644"
  vars:
    app_name: "{{ item }}"
  loop: "{{ _dewy_apps }}"
  notify: Reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start Dewy services (only if dewy.env exists)
  ansible.builtin.systemd:
    name: "dewy-{{ item.item }}.service"
    state: started
    enabled: true
  loop: "{{ dewy_env_stat.results }}"
  when: item.stat.exists
  loop_control:
    label: "{{ item.item }}"
