# Variables applied to all hosts in the local (OrbStack) inventory.
# Override per-host in host_vars/<hostname>.yml if needed.

# --- 3ds_base ---
docker_version: "27"               # Docker Engine major version to install
three_ds_network: "3ds-net"        # Docker bridge network shared by all apps
three_ds_base_dir: "/opt/3ds"      # Root directory for app configs on the VM

# --- dewy_setup ---
dewy_version: "2.14.0"             # Dewy release to install (latest: v2.14.0)
dewy_install_dir: "/usr/local/bin"
dewy_apps: []                      # List of app names to configure (e.g. ["sample-app"])
