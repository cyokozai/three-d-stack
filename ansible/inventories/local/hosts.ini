# OrbStack local VMs — for development and smoke testing
# Usage: ansible-playbook -i inventories/local playbooks/setup-node.yml
#
# OrbStack SSH syntax: ssh <user>@<machine>@orb
# Ansible equivalent:  ansible_host=orb  ansible_user=<user>@<machine>

[three_ds_nodes]
; three-ds ansible_host=orb ansible_user=<user>@three-ds

[three_ds_nodes:vars]
ansible_python_interpreter=/usr/bin/python3
