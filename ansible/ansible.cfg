[defaults]
inventory          = inventories/local/hosts.ini
roles_path         = roles
# WARNING: host_key_checking is disabled for local OrbStack development only.
# For production, set this to True or override per-run:
#   ANSIBLE_HOST_KEY_CHECKING=True ansible-playbook ...
host_key_checking  = False
retry_files_enabled = False
remote_tmp         = /tmp/ansible-3ds

[ssh_connection]
pipelining = True
